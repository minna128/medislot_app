name: medislot
description: MediSlot - Clinic Appointment Booking App (Assignment 4)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Sensors
  local_auth: ^2.1.8
  flutter_local_notifications: ^17.2.2

  # Data / Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Sensors
  geolocator: ^11.0.0
  url_launcher: ^6.2.6
  sensors_plus: ^4.0.2
  permission_handler: ^11.3.1

  # Images
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10

  # UI Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
